<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>MouseView.js with jsPsych 6</title>
    <!-- jsPsych 6 example. For jsPsych 7 and 8 see experiment-v8.html -->
    <script src="https://cdn.jsdelivr.net/npm/jspsych@6.3.1/jspsych.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspsych@6.3.1/plugins/jspsych-html-button-response.js"></script>
    <script src="./jspsych-mouseview-start.js"></script>
    <script src="./jspsych-mouseview-stop.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jspsych@6.3.1/css/jspsych.css">
    <style>
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 120px; font-size: 32px; margin: 40px; }
    </style>
  </head>
  <body></body>
  <script>

  var timeline = [];

  var mouseview_trial_start = ()=> {
    mouseview.logEvent('Trial Started')
  }
  var mouseview_trial_end = ()=> {
    mouseview.logEvent('Trial Ended')
 }
  timeline.push({
      type: 'Mouseview-Start',
      mouseview_url: '../../MouseView.js'
  })

  timeline.push({
    type: 'html-button-response',
    stimulus: '<div class="grid"><div>apple</div><div>spider</div><div>chair</div><div>snake</div></div>',
    choices: ['Next'],
    prompt: "<p>Look around, then press Next.</p>",
    on_start: mouseview_trial_start,
    on_finish: mouseview_trial_end
  });

  timeline.push({
    type: 'html-button-response',
    stimulus: '<div class="grid"><div>kitten</div><div>wasp</div><div>table</div><div>shark</div></div>',
    choices: ['Next'],
    prompt: "<p>Look around, then press Next.</p>",
    on_start: mouseview_trial_start,
    on_finish: mouseview_trial_end
  });

  timeline.push({
    type: 'Mouseview-Stop'
  });

  jsPsych.init({
    timeline: timeline,
    on_finish: function() {
      jsPsych.data.displayData();
    }
  });
</script>
</html>
