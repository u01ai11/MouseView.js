<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd"> 
<html lang="en"> 
    <head> 
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

        <title>MouseView.js Tilt DEMO</title> 
        <style>
            img {
                width: 100%;
                height: 100%;
                object-fit: fill;
            }
            
            body {
  background: url('img/cat_and_dog.jpeg');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
}
        </style>
        <script src="MouseView.js"></script>
        
        <script>
            window.onload = () => {
                mouseview.params.overlayAlpha = 0
                mouseview.params.apertureSize = '10%'
                mouseview.params.mobileTilt = true
                mouseview.params.mobileTiltWarn = false
                
                // iOS only allows motion sensors after a tap
                document.getElementById('tilt').addEventListener('click', () => {
                    mouseview.requestTiltPermission().then((granted) => {
                        document.getElementById('tilt').remove()
                        if (!granted) {
                            alert('Tilt is not available, move your finger over the screen instead')
                        }
                        mouseview.init()
                    })
                })
            }
        </script>
    </head> 
 <body> 
        <button id="tilt" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 2147483647; font-size: 20px; padding: 12px 24px;">Start</button>
        

        
        
    </body> 
</html>
