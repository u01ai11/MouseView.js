<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>MouseView.js parity test</title>
        <!--
        Checks that the CSS overlay (the masks built by MouseView.js) matches the canvas compositing
        of MouseView.js <= 0.1.x, which MouseView-fallback.js reproduces.
        Serve the repository root (e.g. python3 -m http.server) and open /test/parity.html.
        Keep the tab visible while it runs. window.parityResult holds the results when it finishes.
        -->
        <style>
            body { font: 14px/1.4 system-ui, sans-serif; margin: 16px; background: #fff; color: #222; }
            table { border-collapse: collapse; margin-top: 12px; }
            td, th { border: 1px solid #ccc; padding: 2px 8px; text-align: right; }
            .fail { background: #fdd; }
            #status { font-weight: bold; }
        </style>
        <script src="../MouseView.js"></script>
        <script src="../MouseView-fallback.js"></script>
    </head>
    <body>
        <p id="status">Running...</p>
        <table id="results">
            <tr><th>apertureMode</th><th>overlayAlpha</th><th>overlayGaussian</th><th>apertureSize</th><th>apertureGauss</th><th>max colour error</th><th>max blur error</th><th>result</th></tr>
        </table>
        <script>
            var TOLERANCE = 0.03
            var CX, CY

            // the masks the CSS renderer draws, with the linear interpolation CSS gradients use between stops
            function cssWeights(profile, r){
                var i = 1
                while (i < profile.length - 1 && profile[i].r < r) { i++ }
                var a = profile[i - 1], b = profile[i]
                var t = b.r === a.r ? 1 : Math.min(1, Math.max(0, (r - a.r)/(b.r - a.r)))
                if (r >= profile[profile.length - 1].r) { a = b = profile[profile.length - 1]; t = 1 }
                var m1a = a.wC < 1 ? a.wB/(1 - a.wC) : 1, m1b = b.wC < 1 ? b.wB/(1 - b.wC) : 1
                var m2 = a.wC + t*(b.wC - a.wC)
                var m1 = m1a + t*(m1b - m1a)
                return { wC: m2, wB: (1 - m2)*m1 }
            }

            function row(cells, fail){
                var tr = document.createElement('tr')
                if (fail) { tr.className = 'fail' }
                cells.forEach(function(c){ var td = document.createElement('td'); td.textContent = c; tr.appendChild(td) })
                document.getElementById('results').appendChild(tr)
            }

            function run(cfg){
                return new Promise(function(resolve){
                    mouseview.removeAll()
                    Object.assign(mouseview.params, cfg, { forceRenderer: 'fallback', overlayColour: 'black', overlayGaussianFunc: resolve })
                    mouseview.init()
                }).then(function(){
                    document.dispatchEvent(new MouseEvent('mousemove', { clientX: CX, clientY: CY, bubbles: true }))
                    var ctx = document.getElementById('overlay').getContext('2d')
                    var opts = mouseview._internals.profileOptions(mouseview.params, window.innerWidth, window.innerHeight)
                    var rMax = Math.ceil(Math.max(opts.R1, opts.R2) + 5*opts.sigma + 4)
                    var px = ctx.getImageData(CX, CY, rMax, 1).data
                    var profile = mouseview._internals.buildProfile(mouseview.params, window.innerWidth, window.innerHeight)
                    var maxC = 0, maxB = 0
                    for (var i = 0; i < rMax; i++){
                        var r = i + 0.5 // pixel centre
                        // canvas antialiasing of a hard edge is not part of the model
                        if (!(opts.sigma > 0.25) && (Math.abs(r - opts.R1) < 1.5 || Math.abs(r - opts.R2) < 1.5)) { continue }
                        var alpha = px[i*4 + 3]/255
                        var blurred = px[i*4]/255*alpha // the page is white and the overlay black, so premultiplied red is the blurred page's share
                        var w = cssWeights(profile, r)
                        maxC = Math.max(maxC, Math.abs((alpha - blurred) - w.wC))
                        maxB = Math.max(maxB, Math.abs(blurred - w.wB))
                    }
                    var pass = maxC <= TOLERANCE && maxB <= TOLERANCE
                    row([cfg.apertureMode, cfg.overlayAlpha, cfg.overlayGaussian, cfg.apertureSize, cfg.apertureGauss, maxC.toFixed(3), maxB.toFixed(3), pass ? 'pass' : 'FAIL'], !pass)
                    return { config: cfg, maxColourError: maxC, maxBlurError: maxB, pass: pass }
                })
            }

            window.onload = function(){
                // measure on blank page to the right, the results are shown when the test is done
                CX = Math.round(window.innerWidth*0.7)
                CY = Math.round(window.innerHeight*0.5)
                var table = document.getElementById('results')
                table.style.visibility = 'hidden'
                var configs = []
                ;['classic', 'clear'].forEach(function(mode){
                    [0, 0.5, 0.8, 1].forEach(function(alpha){
                        [0, 20].forEach(function(blur){
                            ['5%', '10%', 120].forEach(function(size){
                                [0, 5, 10].forEach(function(gauss){
                                    configs.push({ apertureMode: mode, overlayAlpha: alpha, overlayGaussian: blur, apertureSize: size, apertureGauss: gauss })
                                })
                            })
                        })
                    })
                })
                var results = []
                configs.reduce(function(chain, cfg){
                    return chain.then(function(){ return run(cfg) }).then(function(r){ results.push(r) })
                }, Promise.resolve()).then(function(){
                    mouseview.removeAll()
                    table.style.visibility = 'visible'
                    var failed = results.filter(function(r){ return !r.pass }).length
                    document.getElementById('status').textContent = failed ? failed + ' of ' + results.length + ' configurations FAILED' : 'All ' + results.length + ' configurations pass (tolerance ' + TOLERANCE + ')'
                    document.title = (failed ? 'FAIL' : 'PASS') + ' - MouseView.js parity test'
                    window.parityResult = { pass: !failed, failed: failed, results: results }
                })
            }
        </script>
    </body>
</html>
